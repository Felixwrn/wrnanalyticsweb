<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Countdown</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    text-align: center;
}

h1 {
    margin: 30px 0;
    font-size: 2.5rem;
}

#countdown {
    font-size: clamp(3rem, 10vw, 8rem);
    font-weight: bold;
    letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
}

.label {
    margin-top: 15px;
    color: #aaa;
    font-size: 1rem;
}

/* Twitch Chat */
.chat-container {
    width: 100%;
    max-width: 900px;
    height: 400px;
    margin: 40px auto 0;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}

.chat-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* Mobil */
@media (max-width: 700px) {

    h1 {
        font-size: 1.8rem;
    }

    .chat-container {
        height: 500px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Countdown bis zur Gamescom ONL</h1>

    <div id="countdown">00:00:00:000</div>

    <div class="label">
        Stunden : Minuten : Sekunden : Millisekunden
    </div>

    <!-- Twitch Chat -->
   <div class="chat-container">
    <iframe
        src="https://streamelements.com/overlay/6a8da47aed184ef1a20d11cc/yngpUpjgKgWZccxNOEFId6i_n-i1Ro3KTpAfuG-KKNBYnFeU"
        allowtransparency="true">
    </iframe>
</div>

</div>

<script>
const targetDate = new Date("2026-08-25T20:00:00").getTime();

function updateCountdown() {

    const now = Date.now();
    let distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("countdown").textContent = "00:00:00:000";
        return;
    }

    const hours = Math.floor(distance / 3600000);
    distance %= 3600000;

    const minutes = Math.floor(distance / 60000);
    distance %= 60000;

    const seconds = Math.floor(distance / 1000);
    const milliseconds = distance % 1000;

    document.getElementById("countdown").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0") + ":" +
        String(milliseconds).padStart(3, "0");

    requestAnimationFrame(updateCountdown);
}

updateCountdown();
</script>

</body>
</html>
