<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Countdown</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #1e293b, #020617);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    width: 100%;
    text-align: center;
}

h1 {
    margin-bottom: 25px;
    font-size: 2.5rem;
}

.countdown {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    padding: 35px 25px;
}

#countdown {
    font-size: clamp(3rem, 10vw, 8rem);
    font-weight: bold;
    letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
}

.label {
    margin-top: 15px;
    color: #cbd5e1;
    font-size: 1rem;
}
</style>
</head>

<body>

<div class="container">

    <h1>Countdown bis zur Gamescom ONL</h1>

    <div class="countdown">
        <div id="countdown">00:00:00:000</div>
        <div class="label">Stunden : Minuten : Sekunden : Millisekunden</div>
    </div>

</div>

<script>
const targetDate = new Date("2026-08-25T20:00:00").getTime();

function updateCountdown() {

    const now = Date.now();
    let distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("countdown").textContent = "00:00:00:000";
        return;
    }

    const hours = Math.floor(distance / 3600000);
    distance %= 3600000;

    const minutes = Math.floor(distance / 60000);
    distance %= 60000;

    const seconds = Math.floor(distance / 1000);
    const milliseconds = distance % 1000;

    document.getElementById("countdown").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0") + ":" +
        String(milliseconds).padStart(3, "0");

    requestAnimationFrame(updateCountdown);
}

updateCountdown();
</script>

</body>
</html>
